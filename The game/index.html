<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Game Hub</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e24;
            --primary: #4CAF50;
            --accent: #0dc2ff;
            --text: #ffffff;
            --hazard: #ff4757;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- OPENING SPLASH --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }
        #splash h1 {
            font-size: 3rem;
            color: var(--accent);
            letter-spacing: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        #ui {
            margin: 30px 20px 20px;
            text-align: center;
            background: var(--surface);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn.active { background: var(--accent); color: var(--bg); }
        .btn-eco.active { background: var(--primary); border-color: var(--primary); color: white; }

        .game-wrapper { position: relative; margin-top: 20px; }
        canvas { border-radius: 10px; background-color: #000; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .game-container { display: none; flex-direction: column; align-items: center; }
        .game-container.active { display: flex; }
        .score-board { font-size: 24px; font-weight: bold; margin-bottom: 15px; }

        #game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
        }
        #game-over.active { display: flex; }
    </style>
</head>
<body>

    <div id="splash" onclick="this.style.display='none'">
        <h1>HELLO WORLD</h1>
    </div>

    <div id="ui">
        <h1>Indie Game Hub</h1>
        <div class="btn-group">
            <button class="btn active" id="btn-tetris" onclick="switchGame(this, 'tetris')">Tetris</button>
            <button class="btn" id="btn-snake" onclick="switchGame(this, 'snake')">Snake</button>
            <button class="btn btn-eco" style="border-color: var(--primary); color: var(--primary);" onclick="switchGame(this, 'eco')">Eco Catch</button>
        </div>
    </div>

    <div class="game-wrapper">
        <div id="game-over">
            <h2 style="color: var(--hazard)">GAME OVER</h2>
            <div id="go-score" style="margin-bottom: 20px;">Score: 0</div>
            <button class="btn active" onclick="restartCurrentGame()">Play Again</button>
        </div>

        <div id="tetris-container" class="game-container active">
            <div class="score-board" id="tetris-score">Score: 0</div>
            <canvas id="tetris" width="240" height="400"></canvas>
        </div>

        <div id="snake-container" class="game-container">
            <div class="score-board" id="snake-score">Score: 0</div>
            <canvas id="snake" width="400" height="400"></canvas>
        </div>

        <div id="eco-container" class="game-container">
            <div class="score-board" id="eco-score">Cleaned: 0 | Health: ❤️❤️❤️</div>
            <canvas id="eco" width="400" height="400"></canvas>
        </div>
    </div>

    <script>
        let currentGame = 'tetris';
        let isGameOver = false;
        let activeKeys = {};

        // Loop management
        let loops = { tetris: null, snake: null, eco: null };

        window.addEventListener('keydown', e => activeKeys[e.code] = true);
        window.addEventListener('keyup', e => activeKeys[e.code] = false);

        function switchGame(btn, game) {
            // Stop everything
            cancelAnimationFrame(loops.tetris);
            clearInterval(loops.snake);
            cancelAnimationFrame(loops.eco);
            
            isGameOver = false;
            document.getElementById('game-over').classList.remove('active');
            document.querySelectorAll('.game-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(game + '-container').classList.add('active');
            btn.classList.add('active');
            currentGame = game;

            if(game === 'tetris') resetTetris();
            if(game === 'snake') resetSnake();
            if(game === 'eco') resetEco();
        }

        function triggerGameOver(score) {
            isGameOver = true;
            document.getElementById('go-score').innerText = `Final Score: ${score}`;
            document.getElementById('game-over').classList.add('active');
        }

        function restartCurrentGame() {
            switchGame(document.querySelector(`.btn[onclick*="${currentGame}"]`), currentGame);
        }

        // ==========================================
        //  ECO CATCH (IMPROVED FUN)
        // ==========================================
        const eCanvas = document.getElementById('eco');
        const eCtx = eCanvas.getContext('2d');
        let ecoPlayer, trashes, ecoScore, ecoHealth, ecoSpawnTimer;

        function resetEco() {
            ecoPlayer = { x: 175, velX: 0, w: 50, h: 40 };
            trashes = [];
            ecoScore = 0;
            ecoHealth = 3;
            ecoSpawnTimer = 0;
            updateEco();
        }

        function updateEco() {
            if (isGameOver || currentGame !== 'eco') return;

            // Physics: Smooth sliding instead of jerky jumping
            if (activeKeys['ArrowLeft']) ecoPlayer.velX -= 1.2;
            if (activeKeys['ArrowRight']) ecoPlayer.velX += 1.2;
            ecoPlayer.velX *= 0.85; // Friction
            ecoPlayer.x += ecoPlayer.velX;

            // Walls
            if (ecoPlayer.x < 0) { ecoPlayer.x = 0; ecoPlayer.velX = 0; }
            if (ecoPlayer.x > eCanvas.width - ecoPlayer.w) { ecoPlayer.x = eCanvas.width - ecoPlayer.w; ecoPlayer.velX = 0; }

            eCtx.fillStyle = '#1a3622'; eCtx.fillRect(0, 0, eCanvas.width, eCanvas.height);

            // Spawning Logic
            ecoSpawnTimer++;
            if (ecoSpawnTimer > 30) {
                const type = Math.random();
                let item = { x: Math.random() * (eCanvas.width - 20), y: -20, speed: 3 + Math.random() * 4 };
                if (type > 0.9) item.type = 'gold'; // Bonus
                else if (type < 0.15) item.type = 'toxic'; // Hazard
                else item.type = 'trash';
                trashes.push(item);
                ecoSpawnTimer = 0;
            }

            // Draw Items
            for (let i = trashes.length - 1; i >= 0; i--) {
                let t = trashes[i];
                t.y += t.speed;

                if (t.type === 'gold') eCtx.fillStyle = '#FFD700';
                else if (t.type === 'toxic') eCtx.fillStyle = '#ff4757';
                else eCtx.fillStyle = '#8B4513';
                
                eCtx.fillRect(t.x, t.y, 20, 20);

                // Collision
                if (t.y + 20 > 360 && t.x + 20 > ecoPlayer.x && t.x < ecoPlayer.x + ecoPlayer.w) {
                    if (t.type === 'toxic') ecoHealth--;
                    else ecoScore += (t.type === 'gold' ? 50 : 10);
                    trashes.splice(i, 1);
                } else if (t.y > eCanvas.height) {
                    if (t.type === 'trash') ecoScore = Math.max(0, ecoScore - 5);
                    trashes.splice(i, 1);
                }
            }

            // Draw Player
            eCtx.fillStyle = '#4CAF50';
            eCtx.fillRect(ecoPlayer.x, 360, ecoPlayer.w, ecoPlayer.h);
            eCtx.fillStyle = '#fff'; eCtx.fillRect(ecoPlayer.x + 5, 365, ecoPlayer.w - 10, 5); // Bin highlight

            document.getElementById('eco-score').innerText = `Cleaned: ${ecoScore} | Health: ${'❤️'.repeat(ecoHealth)}`;
            
            if (ecoHealth <= 0) triggerGameOver(ecoScore);
            else loops.eco = requestAnimationFrame(updateEco);
        }

        // ==========================================
        //  TETRIS (STABLE FIX)
        // ==========================================
        const tCanvas = document.getElementById('tetris');
        const tCtx = tCanvas.getContext('2d');
        let tScore, tArena, tPlayer, tLastTime, tDropCounter;

        function resetTetris() {
            tScore = 0; tLastTime = 0; tDropCounter = 0;
            tArena = Array.from({length: 20}, () => Array(12).fill(0));
            tPlayer = { pos: {x: 4, y: 0}, matrix: [[0,1,0],[1,1,1],[0,0,0]] };
            updateTetris();
        }

        function updateTetris(time = 0) {
            if (isGameOver || currentGame !== 'tetris') return;
            const deltaTime = time - tLastTime; tLastTime = time;
            tDropCounter += deltaTime;
            if (tDropCounter > 1000) { tPlayer.pos.y++; if(collide()){tPlayer.pos.y--; merge(); resetPlayer();} tDropCounter = 0; }
            
            tCtx.fillStyle = '#000'; tCtx.fillRect(0,0,240,400);
            tArena.forEach((row, y) => row.forEach((v, x) => { if(v) { tCtx.fillStyle = '#0dc2ff'; tCtx.fillRect(x*20, y*20, 19, 19); }}));
            tPlayer.matrix.forEach((row, y) => row.forEach((v, x) => { if(v) { tCtx.fillStyle = '#ff4757'; tCtx.fillRect((tPlayer.pos.x+x)*20, (tPlayer.pos.y+y)*20, 19, 19); }}));
            
            document.getElementById('tetris-score').innerText = `Score: ${tScore}`;
            loops.tetris = requestAnimationFrame(updateTetris);
        }

        function collide() {
            const [m, o] = [tPlayer.matrix, tPlayer.pos];
            for(let y=0; y<m.length; y++) for(let x=0; x<m[y].length; x++)
                if(m[y][x] && (tArena[y+o.y] && tArena[y+o.y][x+o.x]) !== 0) return true;
            return false;
        }

        function merge() {
            tPlayer.matrix.forEach((row, y) => row.forEach((v, x) => { if(v) tArena[y+tPlayer.pos.y][x+tPlayer.pos.x] = v; }));
            tArena.forEach((row, y) => { if(row.every(v => v !== 0)) { tArena.splice(y, 1); tArena.unshift(new Array(12).fill(0)); tScore+=100; }});
        }

        function resetPlayer() {
            tPlayer.pos = {x: 4, y: 0};
            if(collide()) triggerGameOver(tScore);
        }

        // ==========================================
        //  SNAKE (STABLE FIX)
        // ==========================================
        const sCanvas = document.getElementById('snake');
        const sCtx = sCanvas.getContext('2d');
        let snake, food, sDir, sScore;

        function resetSnake() {
            snake = [{x: 200, y: 200}]; sDir = {x: 20, y: 0}; sScore = 0;
            food = {x: 100, y: 100};
            if(loops.snake) clearInterval(loops.snake);
            loops.snake = setInterval(updateSnake, 100);
        }

        function updateSnake() {
            if (isGameOver || currentGame !== 'snake') return;
            if (activeKeys['ArrowLeft'] && sDir.x === 0) sDir = {x: -20, y: 0};
            if (activeKeys['ArrowRight'] && sDir.x === 0) sDir = {x: 20, y: 0};
            if (activeKeys['ArrowUp'] && sDir.y === 0) sDir = {x: 0, y: -20};
            if (activeKeys['ArrowDown'] && sDir.y === 0) sDir = {x: 0, y: 20};

            const head = {x: snake[0].x + sDir.x, y: snake[0].y + sDir.y};
            if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400 || snake.some(p => p.x === head.x && p.y === head.y)) return triggerGameOver(sScore);
            
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                sScore += 10; food = {x: Math.floor(Math.random()*19)*20, y: Math.floor(Math.random()*19)*20};
            } else snake.pop();

            sCtx.fillStyle = '#000'; sCtx.fillRect(0,0,400,400);
            sCtx.fillStyle = 'red'; sCtx.fillRect(food.x, food.y, 18, 18);
            sCtx.fillStyle = '#0dc2ff'; snake.forEach(p => sCtx.fillRect(p.x, p.y, 18, 18));
            document.getElementById('snake-score').innerText = `Score: ${sScore}`;
        }

        // Handle Tetris Rotation separately (single press)
        window.addEventListener('keydown', e => {
            if(currentGame === 'tetris' && !isGameOver) {
                if(e.code === 'ArrowUp') {
                    const m = tPlayer.matrix;
                    for(let y=0; y<m.length; y++) for(let x=0; x<y; x++) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
                    m.forEach(row => row.reverse());
                    if(collide()) { m.forEach(row => row.reverse()); for(let y=0; y<m.length; y++) for(let x=0; x<y; x++) [m[x][y], m[y][x]] = [m[y][x], m[x][y]]; }
                }
                if(e.code === 'ArrowLeft') { tPlayer.pos.x--; if(collide()) tPlayer.pos.x++; }
                if(e.code === 'ArrowRight') { tPlayer.pos.x++; if(collide()) tPlayer.pos.x--; }
                if(e.code === 'ArrowDown') { tPlayer.pos.y++; if(collide()) tPlayer.pos.y--; }
            }
        });

        // Init
        resetTetris();
    </script>
</body>
</html>
