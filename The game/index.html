<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Game Hub</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e24;
            --primary: #4CAF50; /* Eco Green */
            --accent: #0dc2ff;
            --text: #ffffff;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        #ui {
            margin: 30px 20px 20px;
            text-align: center;
            background: var(--surface);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { margin-top: 0; font-weight: 600; letter-spacing: 1px; }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(13, 194, 255, 0.1);
        }

        .btn.active {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 15px rgba(13, 194, 255, 0.4);
        }

        .btn[onclick*="eco"].active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }

        .game-wrapper {
            position: relative;
            margin-top: 20px;
        }

        canvas {
            border-radius: 10px;
            background-color: #000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .game-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .game-container.active { display: flex; }
        
        .score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .controls { 
            margin-top: 15px; 
            color: #aaa; 
            font-size: 14px; 
            background: var(--surface);
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Game Over Overlay */
        #game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
        }

        #game-over.active { display: flex; }
        #game-over h2 { color: #ff4757; font-size: 36px; margin: 0 0 10px; }
        #go-score { font-size: 20px; margin-bottom: 20px; }
        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .restart-btn:hover { background: #45a049; transform: scale(1.05); }

    </style>
</head>
<body>

    <div id="ui">
        <h1>Indie Game Hub</h1>
        <div class="btn-group">
            <button class="btn active" id="btn-tetris" onclick="switchGame(this, 'tetris')">Tetris</button>
            <button class="btn" id="btn-snake" onclick="switchGame(this, 'snake')">Snake</button>
            <button class="btn" style="border-color: var(--primary); color: var(--primary);" onclick="switchGame(this, 'eco')">Eco Catch (Laudato si')</button>
        </div>
    </div>

    <div class="game-wrapper">
        <div id="game-over">
            <h2>GAME OVER</h2>
            <div id="go-score">Score: 0</div>
            <button class="restart-btn" onclick="restartCurrentGame()">Play Again</button>
        </div>

        <div id="tetris-container" class="game-container active">
            <div class="score-board" id="tetris-score">Score: 0</div>
            <canvas id="tetris" width="240" height="400"></canvas>
            <div class="controls">Arrows to Move & Rotate</div>
        </div>

        <div id="snake-container" class="game-container">
            <div class="score-board" id="snake-score">Score: 0</div>
            <canvas id="snake" width="400" height="400"></canvas>
            <div class="controls">Arrows to Move</div>
        </div>

        <div id="eco-container" class="game-container">
            <div class="score-board" id="eco-score">Cleaned: 0 | Missed: 0/3</div>
            <canvas id="eco" width="400" height="400" style="background-color: #1a3622;"></canvas>
            <div class="controls">Arrows Left/Right to Catch Trash</div>
        </div>
    </div>

    <script>
        // --- GLOBAL STATE ---
        let currentGame = 'tetris';
        let isGameOver = false;

        // Loop references for clean debugging/stopping
        let snakeGameLoop;
        let tetrisReqId;
        let ecoReqId;

        // --- NAVIGATION LOGIC ---
        function switchGame(btnElement, game) {
            // Stop all current games
            cancelAnimationFrame(tetrisReqId);
            clearInterval(snakeGameLoop);
            cancelAnimationFrame(ecoReqId);
            hideGameOver();

            // UI Updates
            document.querySelectorAll('.game-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(game + '-container').classList.add('active');
            btnElement.classList.add('active');
            
            currentGame = game;

            // Start new game
            if(game === 'tetris') resetTetris();
            else if(game === 'snake') resetSnake();
            else if(game === 'eco') resetEco();
        }

        function triggerGameOver(score) {
            isGameOver = true;
            cancelAnimationFrame(tetrisReqId);
            clearInterval(snakeGameLoop);
            cancelAnimationFrame(ecoReqId);
            
            document.getElementById('go-score').innerText = `Final Score: ${score}`;
            document.getElementById('game-over').classList.add('active');
        }

        function hideGameOver() {
            isGameOver = false;
            document.getElementById('game-over').classList.remove('active');
        }

        function restartCurrentGame() {
            hideGameOver();
            if(currentGame === 'tetris') resetTetris();
            else if(currentGame === 'snake') resetSnake();
            else if(currentGame === 'eco') resetEco();
        }


        // ==========================================
        //               TETRIS LOGIC
        // ==========================================
        const tCanvas = document.getElementById('tetris');
        const tCtx = tCanvas.getContext('2d');
        tCtx.scale(20, 20);

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
            updateTetrisScore();
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
            else if (type === 'O') return [[2, 2], [2, 2]];
            else if (type === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
            else if (type === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
            else if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            else if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }

        function drawTetris() {
            tCtx.fillStyle = '#000';
            tCtx.fillRect(0, 0, tCanvas.width, tCanvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        tCtx.fillStyle = ['#ff0d72','#0dc2ff','#0dff72','#f538ff','#ff8e0d','#ffe138','#3877ff'][value-1];
                        tCtx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            // Game Over Check
            if (collide(arena, player)) {
                triggerGameOver(player.score);
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        const arena = createMatrix(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        function updateTetris(time = 0) {
            if (isGameOver || currentGame !== 'tetris') return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            drawTetris();
            tetrisReqId = requestAnimationFrame(updateTetris);
        }

        function updateTetrisScore() {
            document.getElementById('tetris-score').innerText = `Score: ${player.score}`;
        }

        function resetTetris() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            dropCounter = 0;
            updateTetrisScore();
            playerReset();
            updateTetris();
        }


        // ==========================================
        //               SNAKE LOGIC
        // ==========================================
        const sCanvas = document.getElementById('snake');
        const sCtx = sCanvas.getContext('2d');
        let snake, food, dx, dy, sScore;

        function resetSnake() {
            snake = [{x: 200, y: 200}, {x: 190, y: 200}, {x: 180, y: 200}];
            dx = 10; dy = 0;
            sScore = 0;
            createFood();
            document.getElementById('snake-score').innerText = `Score: ${sScore}`;
            
            if(snakeGameLoop) clearInterval(snakeGameLoop);
            snakeGameLoop = setInterval(mainSnake, 100);
        }

        function mainSnake() {
            if (isGameOver || currentGame !== 'snake') return;
            if (didGameEnd()) {
                triggerGameOver(sScore);
                return;
            }
            sCtx.fillStyle = "black";
            sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);
            drawFood();
            advanceSnake();
            drawSnake();
        }

        function drawSnake() {
            snake.forEach(part => {
                sCtx.fillStyle = '#0dc2ff';
                sCtx.fillRect(part.x, part.y, 10, 10);
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (snake[0].x === food.x && snake[0].y === food.y) {
                sScore += 10;
                document.getElementById('snake-score').innerText = `Score: ${sScore}`;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x > sCanvas.width - 10 || snake[0].y < 0 || snake[0].y > sCanvas.height - 10;
        }

        function createFood() {
            food = {
                x: Math.floor(Math.random() * (sCanvas.width/10)) * 10,
                y: Math.floor(Math.random() * (sCanvas.height/10)) * 10
            };
        }

        function drawFood() {
            sCtx.fillStyle = "#ff4757";
            sCtx.fillRect(food.x, food.y, 10, 10);
        }


        // ==========================================
        //          ECO CATCHER (LAUDATO SI)
        // ==========================================
        const eCanvas = document.getElementById('eco');
        const eCtx = eCanvas.getContext('2d');
        
        let ecoPlayer = { x: 175, y: 360, width: 50, height: 40, speed: 20 };
        let trashes = [];
        let ecoScore = 0;
        let missedTrash = 0;
        let spawnTimer = 0;

        function resetEco() {
            ecoPlayer.x = 175;
            trashes = [];
            ecoScore = 0;
            missedTrash = 0;
            updateEcoScore();
            updateEco();
        }

        function spawnTrash() {
            const size = 15;
            const x = Math.random() * (eCanvas.width - size);
            // Different colors for different types of "trash"
            const colors = ['#8B4513', '#A9A9A9', '#FF6347']; 
            trashes.push({
                x: x, 
                y: 0, 
                size: size, 
                speed: 2 + Math.random() * 3,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        function updateEcoScore() {
            document.getElementById('eco-score').innerText = `Cleaned: ${ecoScore} | Missed: ${missedTrash}/3`;
        }

        function updateEco() {
            if (isGameOver || currentGame !== 'eco') return;

            // Clear canvas
            eCtx.clearRect(0, 0, eCanvas.width, eCanvas.height);

            // Draw player (Recycle Bin)
            eCtx.fillStyle = '#4CAF50';
            eCtx.fillRect(ecoPlayer.x, ecoPlayer.y, ecoPlayer.width, ecoPlayer.height);
            eCtx.fillStyle = '#388E3C';
            eCtx.fillRect(ecoPlayer.x - 5, ecoPlayer.y, ecoPlayer.width + 10, 8); // Bin lid

            // Spawn logic
            spawnTimer++;
            if (spawnTimer > 40) { // Adjust for difficulty
                spawnTrash();
                spawnTimer = 0;
            }

            // Update and draw trash
            for (let i = trashes.length - 1; i >= 0; i--) {
                let t = trashes[i];
                t.y += t.speed;

                // Draw trash
                eCtx.fillStyle = t.color;
                eCtx.fillRect(t.x, t.y, t.size, t.size);

                // Collision with player
                if (t.y + t.size > ecoPlayer.y && 
                    t.x + t.size > ecoPlayer.x && 
                    t.x < ecoPlayer.x + ecoPlayer.width &&
                    t.y < ecoPlayer.y + ecoPlayer.height) {
                    trashes.splice(i, 1);
                    ecoScore += 10;
                    updateEcoScore();
                } 
                // Missed trash
                else if (t.y > eCanvas.height) {
                    trashes.splice(i, 1);
                    missedTrash++;
                    updateEcoScore();
                    if (missedTrash >= 3) {
                        triggerGameOver(ecoScore);
                        return;
                    }
                }
            }

            ecoReqId = requestAnimationFrame(updateEco);
        }


        // ==========================================
        //             KEYBOARD INPUTS
        // ==========================================
        document.addEventListener('keydown', event => {
            if(isGameOver) return;

            // Tetris
            if (currentGame === 'tetris') {
                if (event.keyCode === 37) playerMove(-1);
                else if (event.keyCode === 39) playerMove(1);
                else if (event.keyCode === 40) playerDrop();
                else if (event.keyCode === 38) playerRotate(1);
            }
            // Snake
            else if (currentGame === 'snake') {
                if (event.keyCode === 37 && dx === 0) { dx = -10; dy = 0; }
                else if (event.keyCode === 38 && dy === 0) { dx = 0; dy = -10; }
                else if (event.keyCode === 39 && dx === 0) { dx = 10; dy = 0; }
                else if (event.keyCode === 40 && dy === 0) { dx = 0; dy = 10; }
            }
            // Eco Catch
            else if (currentGame === 'eco') {
                if (event.keyCode === 37) {
                    ecoPlayer.x -= ecoPlayer.speed;
                    if(ecoPlayer.x < 0) ecoPlayer.x = 0;
                }
                else if (event.keyCode === 39) {
                    ecoPlayer.x += ecoPlayer.speed;
                    if(ecoPlayer.x + ecoPlayer.width > eCanvas.width) ecoPlayer.x = eCanvas.width - ecoPlayer.width;
                }
            }
        });

        // Initialize
        resetTetris();

    </script>
</body>
</html>
