<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Game Hub</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }
        #ui {
            margin: 20px;
            text-align: center;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #3498db;
            border: none;
            color: white;
            border-radius: 5px;
            margin: 0 5px;
            transition: 0.3s;
        }
        .btn:hover { background: #2980b9; }
        .btn.active { background: #e74c3c; }

        canvas {
            border: 4px solid #333;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .game-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .game-container.active { display: flex; }
        
        #score { font-size: 24px; margin-bottom: 10px; }
        .controls { margin-top: 10px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Indie Game Hub</h1>
        <button class="btn active" onclick="switchGame('tetris')">Tetris</button>
        <button class="btn" onclick="switchGame('snake')">Snake</button>
    </div>

    <div id="tetris-container" class="game-container active">
        <div id="tetris-score">Score: 0</div>
        <canvas id="tetris" width="240" height="400"></canvas>
        <div class="controls">Arrows to Move & Rotate</div>
    </div>

    <div id="snake-container" class="game-container">
        <div id="snake-score">Score: 0</div>
        <canvas id="snake" width="400" height="400"></canvas>
        <div class="controls">Arrows to Move</div>
    </div>

    <script>
        // --- Navigation Logic ---
        function switchGame(game) {
            document.querySelectorAll('.game-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.btn').forEach(el => el.classList.remove('active'));
            
            if(game === 'tetris') {
                document.getElementById('tetris-container').classList.add('active');
                event.target.classList.add('active');
                resetTetris();
            } else {
                document.getElementById('snake-container').classList.add('active');
                event.target.classList.add('active');
                resetSnake();
            }
        }

        // --- TETRIS LOGIC ---
        const tCanvas = document.getElementById('tetris');
        const tCtx = tCanvas.getContext('2d');
        tCtx.scale(20, 20);

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
            }
            updateScore();
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
            else if (type === 'O') return [[2, 2], [2, 2]];
            else if (type === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
            else if (type === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
            else if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            else if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            else if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }

        function draw() {
            tCtx.fillStyle = '#000';
            tCtx.fillRect(0, 0, tCanvas.width, tCanvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        tCtx.fillStyle = ['#ff0d72','#0dc2ff','#0dff72','#f538ff','#ff8e0d','#ffe138','#3877ff'][value-1];
                        tCtx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function updateTetris(time = 0) {
            if (!document.getElementById('tetris-container').classList.contains('active')) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(updateTetris);
        }

        function updateScore() {
            document.getElementById('tetris-score').innerText = `Score: ${player.score}`;
        }

        const arena = createMatrix(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        function resetTetris() {
            playerReset();
            updateScore();
            updateTetris();
        }

        // --- SNAKE LOGIC ---
        const sCanvas = document.getElementById('snake');
        const sCtx = sCanvas.getContext('2d');
        let snake, food, dx, dy, sScore, snakeGameLoop;

        function resetSnake() {
            snake = [{x: 200, y: 200}, {x: 190, y: 200}, {x: 180, y: 200}];
            dx = 10; dy = 0;
            sScore = 0;
            createFood();
            if(snakeGameLoop) clearInterval(snakeGameLoop);
            snakeGameLoop = setInterval(mainSnake, 100);
            document.getElementById('snake-score').innerText = `Score: ${sScore}`;
        }

        function mainSnake() {
            if (!document.getElementById('snake-container').classList.contains('active')) return;
            if (didGameEnd()) {
                resetSnake();
                return;
            }
            clearCanvas();
            drawFood();
            advanceSnake();
            drawSnake();
        }

        function clearCanvas() {
            sCtx.fillStyle = "black";
            sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);
        }

        function drawSnake() {
            snake.forEach(part => {
                sCtx.fillStyle = '#0dff72';
                sCtx.fillRect(part.x, part.y, 10, 10);
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (snake[0].x === food.x && snake[0].y === food.y) {
                sScore += 10;
                document.getElementById('snake-score').innerText = `Score: ${sScore}`;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x > sCanvas.width - 10 || snake[0].y < 0 || snake[0].y > sCanvas.height - 10;
        }

        function createFood() {
            food = {
                x: Math.floor(Math.random() * (sCanvas.width/10)) * 10,
                y: Math.floor(Math.random() * (sCanvas.height/10)) * 10
            };
        }

        function drawFood() {
            sCtx.fillStyle = "red";
            sCtx.fillRect(food.x, food.y, 10, 10);
        }

        // --- Keyboard Handling ---
        document.addEventListener('keydown', event => {
            // Tetris
            if (document.getElementById('tetris-container').classList.contains('active')) {
                if (event.keyCode === 37) playerMove(-1);
                else if (event.keyCode === 39) playerMove(1);
                else if (event.keyCode === 40) playerDrop();
                else if (event.keyCode === 38) playerRotate(1);
            }
            // Snake
            else {
                if (event.keyCode === 37 && dx === 0) { dx = -10; dy = 0; }
                else if (event.keyCode === 38 && dy === 0) { dx = 0; dy = -10; }
                else if (event.keyCode === 39 && dx === 0) { dx = 10; dy = 0; }
                else if (event.keyCode === 40 && dy === 0) { dx = 0; dy = 10; }
            }
        });

        // Initialize first game
        resetTetris();

    </script>
</body>
</html>
